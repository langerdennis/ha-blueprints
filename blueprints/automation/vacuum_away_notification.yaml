blueprint:
  name: "Vacuum: Away Prompt (Actionable Notification)"
  description: >
    Sends at most one actionable notification per day to two smartphones
    (Home Assistant Companion App) when both residents have been away for a
    configurable duration and no cleaning has happened today. Synchronously
    clears open notifications on both devices as soon as an action is chosen
    or either resident returns home.
  domain: automation
  homeassistant:
    min_version: "2024.8.0"
  source_url: https://github.com/langerdennis/ha-blueprints/blob/main/blueprints/automation/vacuum_away_notification.yaml

  input:
    residents_section:
      name: "Residents & Smartphones"
      icon: mdi:account-multiple
      description: "Select both person entities and their corresponding devices running the Home Assistant Companion App."
      input:
        person_1:
          name: "Person 1"
          selector:
            entity:
              filter:
                - domain: person
        notify_device_1:
          name: "Person 1 Smartphone"
          selector:
            device:
              integration: mobile_app
        person_2:
          name: "Person 2"
          selector:
            entity:
              filter:
                - domain: person
        notify_device_2:
          name: "Person 2 Smartphone"
          selector:
            device:
              integration: mobile_app

    vacuum_section:
      name: "Vacuum & Daily Lock"
      icon: mdi:robot-vacuum
      description: "Configure the vacuum entity and the daily prompt tracking helper."
      input:
        vacuum_entity:
          name: "Vacuum"
          selector:
            entity:
              filter:
                - domain: vacuum
        last_prompt_helper:
          name: "Date Helper (Last Prompt)"
          description: >
            A 'Date' input_datetime helper (date only, no time).
            Persists across restarts whether a prompt action (start or skip) was already chosen today.
          selector:
            entity:
              filter:
                - domain: input_datetime
        last_clean_sensors:
          name: "Last Clean Timestamp Sensor (optional, recommended)"
          description: >
            One or more timestamp sensors of the vacuum (e.g. sensor.*_last_clean_begin or sensor.*_last_clean_end).
            Automatically suppresses prompts if a manual or scheduled clean already started or finished today.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: timestamp

    rooms_section:
      name: "Room Selection for 'Main Areas' Button"
      icon: mdi:floor-plan
      description: "Defines which areas or room segments are cleaned when tapping 'Main Areas' in the notification."
      input:
        main_area_mode:
          name: "Room Cleaning Method"
          default: "areas"
          selector:
            select:
              mode: dropdown
              options:
                - label: "Home Assistant Areas (vacuum.clean_area – recommended)"
                  value: "areas"
                - label: "Segment IDs (vacuum.send_command / app_segment_clean)"
                  value: "segments"
        main_areas:
          name: "Main Areas (Home Assistant Areas)"
          description: "Used when 'Home Assistant Areas' is selected above."
          default: []
          selector:
            area:
              multiple: true
        main_segment_ids:
          name: "Segment IDs (comma-separated)"
          description: "Used when 'Segment IDs' is selected above (e.g. 16, 17, 18)."
          default: ""
          selector:
            text: {}

    options_section:
      name: "Schedule & Comfort Options"
      icon: mdi:clock-outline
      collapsed: true
      description: "Optional fine-tuning for leave delay, active time window, notification text, and override switches."
      input:
        leave_delay_minutes:
          name: "Leave Delay"
          description: "Prevents notifications during brief departures."
          default: 10
          selector:
            number:
              min: 1
              max: 60
              mode: slider
              unit_of_measurement: "minutes"
        window_start:
          name: "Earliest Prompt Time"
          default: "08:00:00"
          selector:
            time: {}
        window_end:
          name: "Latest Prompt Time"
          default: "20:00:00"
          selector:
            time: {}
        notification_title:
          name: "Notification Title"
          default: "🤖 Start Vacuum?"
          selector:
            text: {}
        notification_message:
          name: "Notification Message"
          default: "Both residents are away. Would you like to start cleaning?"
          selector:
            text: {}
        water_shortage_note:
          name: "Water Tank Empty Note"
          description: "Appended to the notification message when a water shortage sensor is 'on'."
          default: "(💧 Note: Water tank empty)"
          selector:
            text: {}
        action_full_label:
          name: "Action Button: Full Clean"
          default: "🏠 Full Clean"
          selector:
            text: {}
        action_main_label:
          name: "Action Button: Main Areas"
          default: "🛋️ Main Areas"
          selector:
            text: {}
        action_skip_label:
          name: "Action Button: Skip Today"
          default: "⏭️ Skip Today"
          selector:
            text: {}
        water_shortage_sensors:
          name: "Water Tank Empty Sensor (optional)"
          description: "Appends a note to the notification text if the selected binary sensor is 'on'."
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
        block_helpers:
          name: "Override / Guest Mode Switches (optional)"
          description: "Suppresses the prompt whenever any of these input_boolean helpers is turned 'on'."
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean

mode: queued
max: 10

trigger_variables:
  t_person_1: !input person_1
  t_person_2: !input person_2

variables:
  v_person_1: !input person_1
  v_person_2: !input person_2
  v_vacuum: !input vacuum_entity
  v_date_helper: !input last_prompt_helper
  v_last_clean_sensors: !input last_clean_sensors
  v_area_mode: !input main_area_mode
  v_main_areas: !input main_areas
  v_segment_ids: !input main_segment_ids
  v_title: !input notification_title
  v_message_base: !input notification_message
  v_water_note: !input water_shortage_note
  v_act_full_label: !input action_full_label
  v_act_main_label: !input action_main_label
  v_act_skip_label: !input action_skip_label
  v_water_sensors: !input water_shortage_sensors
  v_block_helpers: !input block_helpers
  v_self_id: "{{ this.entity_id | default('automation.vacuum_away_notification') }}"
  v_tag: "{{ 'vacuum_prompt_' ~ (v_self_id | slugify) }}"
  v_act_full: "{{ 'VACUUM_FULL_' ~ v_self_id }}"
  v_act_main: "{{ 'VACUUM_MAIN_' ~ v_self_id }}"
  v_act_skip: "{{ 'VACUUM_SKIP_' ~ v_self_id }}"
  v_message: >-
    {%- set water_empty = (v_water_sensors | length > 0) and (v_water_sensors | select('is_state', 'on') | list | length > 0) -%}
    {{ v_message_base }}{{ (' ' ~ v_water_note) if water_empty else '' }}

triggers:
  # 1) Both residents continuously away for the configured duration
  - trigger: template
    value_template: >-
      {{ not is_state(t_person_1, 'home') and not is_state(t_person_2, 'home') }}
    for:
      minutes: !input leave_delay_minutes
    id: ask_clean

  # 2) Fallback at window start (in case both left before window_start)
  - trigger: time
    at: !input window_start
    id: ask_clean_morning

  # 3) Either resident returns home -> clear open notifications (do not stop active clean)
  - trigger: state
    entity_id:
      - !input person_1
      - !input person_2
    to: "home"
    id: someone_home

  # 4) Action button tapped in the Companion App
  - trigger: event
    event_type: mobile_app_notification_action
    id: button_pressed

conditions: []

actions:
  - choose:
      # ========================================================================
      # PATH 1A: Morning fallback -> pre-check, leave delay, re-check & notify
      # ========================================================================
      - conditions:
          - condition: trigger
            id: ask_clean_morning
          - condition: template
            alias: "Both residents currently away"
            value_template: >-
              {{ not is_state(v_person_1, 'home') and not is_state(v_person_2, 'home') }}
          - condition: template
            alias: "Vacuum is docked"
            value_template: "{{ is_state(v_vacuum, 'docked') }}"
          - condition: template
            alias: "Not prompted yet today"
            value_template: "{{ states(v_date_helper) != (now().date() | string) }}"
          - condition: template
            alias: "No override switch active"
            value_template: >-
              {{ (v_block_helpers | length == 0)
                 or (v_block_helpers | select('is_state', 'on') | list | length == 0) }}
          - condition: template
            alias: "Not cleaned yet today"
            value_template: >-
              {% set ns = namespace(cleaned_today=false) %}
              {% for s in v_last_clean_sensors %}
                {% set lc = states(s) %}
                {% if lc not in ['unknown', 'unavailable', ''] %}
                  {% set dt = lc | as_datetime(none) %}
                  {% if dt is not none and (dt | as_local).date() >= now().date() %}
                    {% set ns.cleaned_today = true %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ not ns.cleaned_today }}
        sequence:
          - delay:
              minutes: !input leave_delay_minutes
          - condition: template
            alias: "Both residents still away"
            value_template: >-
              {{ not is_state(v_person_1, 'home') and not is_state(v_person_2, 'home') }}
          - condition: time
            after: !input window_start
            before: !input window_end
          - condition: template
            alias: "Vacuum still docked"
            value_template: "{{ is_state(v_vacuum, 'docked') }}"
          - condition: template
            alias: "Still not prompted today"
            value_template: "{{ states(v_date_helper) != (now().date() | string) }}"
          - condition: template
            alias: "No override switch active"
            value_template: >-
              {{ (v_block_helpers | length == 0)
                 or (v_block_helpers | select('is_state', 'on') | list | length == 0) }}
          - condition: template
            alias: "Still not cleaned yet today"
            value_template: >-
              {% set ns = namespace(cleaned_today=false) %}
              {% for s in v_last_clean_sensors %}
                {% set lc = states(s) %}
                {% if lc not in ['unknown', 'unavailable', ''] %}
                  {% set dt = lc | as_datetime(none) %}
                  {% if dt is not none and (dt | as_local).date() >= now().date() %}
                    {% set ns.cleaned_today = true %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ not ns.cleaned_today }}
          - domain: mobile_app
            type: notify
            device_id: !input notify_device_1
            title: "{{ v_title }}"
            message: "{{ v_message }}"
            data:
              tag: "{{ v_tag }}"
              ttl: 0
              priority: high
              actions:
                - action: "{{ v_act_full }}"
                  title: "{{ v_act_full_label }}"
                - action: "{{ v_act_main }}"
                  title: "{{ v_act_main_label }}"
                - action: "{{ v_act_skip }}"
                  title: "{{ v_act_skip_label }}"
          - domain: mobile_app
            type: notify
            device_id: !input notify_device_2
            title: "{{ v_title }}"
            message: "{{ v_message }}"
            data:
              tag: "{{ v_tag }}"
              ttl: 0
              priority: high
              actions:
                - action: "{{ v_act_full }}"
                  title: "{{ v_act_full_label }}"
                - action: "{{ v_act_main }}"
                  title: "{{ v_act_main_label }}"
                - action: "{{ v_act_skip }}"
                  title: "{{ v_act_skip_label }}"

      # ========================================================================
      # PATH 1B: Regular away trigger within active time window
      # ========================================================================
      - conditions:
          - condition: trigger
            id: ask_clean
          - condition: time
            after: !input window_start
            before: !input window_end
          - condition: template
            alias: "Vacuum is docked"
            value_template: "{{ is_state(v_vacuum, 'docked') }}"
          - condition: template
            alias: "Not prompted yet today"
            value_template: "{{ states(v_date_helper) != (now().date() | string) }}"
          - condition: template
            alias: "No override switch active"
            value_template: >-
              {{ (v_block_helpers | length == 0)
                 or (v_block_helpers | select('is_state', 'on') | list | length == 0) }}
          - condition: template
            alias: "Not cleaned yet today"
            value_template: >-
              {% set ns = namespace(cleaned_today=false) %}
              {% for s in v_last_clean_sensors %}
                {% set lc = states(s) %}
                {% if lc not in ['unknown', 'unavailable', ''] %}
                  {% set dt = lc | as_datetime(none) %}
                  {% if dt is not none and (dt | as_local).date() >= now().date() %}
                    {% set ns.cleaned_today = true %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ not ns.cleaned_today }}
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device_1
            title: "{{ v_title }}"
            message: "{{ v_message }}"
            data:
              tag: "{{ v_tag }}"
              ttl: 0
              priority: high
              actions:
                - action: "{{ v_act_full }}"
                  title: "{{ v_act_full_label }}"
                - action: "{{ v_act_main }}"
                  title: "{{ v_act_main_label }}"
                - action: "{{ v_act_skip }}"
                  title: "{{ v_act_skip_label }}"
          - domain: mobile_app
            type: notify
            device_id: !input notify_device_2
            title: "{{ v_title }}"
            message: "{{ v_message }}"
            data:
              tag: "{{ v_tag }}"
              ttl: 0
              priority: high
              actions:
                - action: "{{ v_act_full }}"
                  title: "{{ v_act_full_label }}"
                - action: "{{ v_act_main }}"
                  title: "{{ v_act_main_label }}"
                - action: "{{ v_act_skip }}"
                  title: "{{ v_act_skip_label }}"

      # ========================================================================
      # PATH 2: Action "Full Clean" tapped
      # ========================================================================
      - conditions:
          - condition: trigger
            id: button_pressed
          - condition: template
            alias: "Matched 'Full Clean' action for this automation"
            value_template: >-
              {{ (trigger is defined) and (trigger.event.data.action | default('') == v_act_full) }}
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device_1
            message: "clear_notification"
            data:
              tag: "{{ v_tag }}"
              ttl: 0
              priority: high
          - domain: mobile_app
            type: notify
            device_id: !input notify_device_2
            message: "clear_notification"
            data:
              tag: "{{ v_tag }}"
              ttl: 0
              priority: high
          - action: input_datetime.set_datetime
            target:
              entity_id: !input last_prompt_helper
            data:
              date: "{{ now().date() | string }}"
          - condition: template
            alias: "Vacuum still docked"
            value_template: "{{ is_state(v_vacuum, 'docked') }}"
          - action: vacuum.start
            target:
              entity_id: !input vacuum_entity

      # ========================================================================
      # PATH 3: Action "Main Areas" tapped
      # ========================================================================
      - conditions:
          - condition: trigger
            id: button_pressed
          - condition: template
            alias: "Matched 'Main Areas' action for this automation"
            value_template: >-
              {{ (trigger is defined) and (trigger.event.data.action | default('') == v_act_main) }}
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device_1
            message: "clear_notification"
            data:
              tag: "{{ v_tag }}"
              ttl: 0
              priority: high
          - domain: mobile_app
            type: notify
            device_id: !input notify_device_2
            message: "clear_notification"
            data:
              tag: "{{ v_tag }}"
              ttl: 0
              priority: high
          - action: input_datetime.set_datetime
            target:
              entity_id: !input last_prompt_helper
            data:
              date: "{{ now().date() | string }}"
          - condition: template
            alias: "Vacuum still docked"
            value_template: "{{ is_state(v_vacuum, 'docked') }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ v_area_mode == 'areas' and (v_main_areas | length > 0) }}"
                sequence:
                  - action: vacuum.clean_area
                    target:
                      entity_id: !input vacuum_entity
                    data:
                      cleaning_area_id: !input main_areas
              - conditions:
                  - condition: template
                    value_template: "{{ v_area_mode == 'segments' and (v_segment_ids | trim != '') }}"
                sequence:
                  - action: vacuum.send_command
                    target:
                      entity_id: !input vacuum_entity
                    data:
                      command: app_segment_clean
                      params:
                        - segments: >-
                            {{ v_segment_ids.split(',') | map('trim') | reject('eq', '') | map('int', 0) | reject('eq', 0) | list }}
                          repeat: 1

      # ========================================================================
      # PATH 4: Action "Skip Today" tapped -> mark day done & clear notifications
      # ========================================================================
      - conditions:
          - condition: trigger
            id: button_pressed
          - condition: template
            alias: "Matched 'Skip Today' action for this automation"
            value_template: >-
              {{ (trigger is defined) and (trigger.event.data.action | default('') == v_act_skip) }}
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: !input last_prompt_helper
            data:
              date: "{{ now().date() | string }}"
          - domain: mobile_app
            type: notify
            device_id: !input notify_device_1
            message: "clear_notification"
            data:
              tag: "{{ v_tag }}"
              ttl: 0
              priority: high
          - domain: mobile_app
            type: notify
            device_id: !input notify_device_2
            message: "clear_notification"
            data:
              tag: "{{ v_tag }}"
              ttl: 0
              priority: high

      # ========================================================================
      # PATH 5: Resident returned home -> clear notifications only (do not lock day)
      # ========================================================================
      - conditions:
          - condition: trigger
            id: someone_home
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device_1
            message: "clear_notification"
            data:
              tag: "{{ v_tag }}"
              ttl: 0
              priority: high
          - domain: mobile_app
            type: notify
            device_id: !input notify_device_2
            message: "clear_notification"
            data:
              tag: "{{ v_tag }}"
              ttl: 0
              priority: high
